<!-- Gem.AI · Change Email Address · cole em Authentication → Email Templates -->
<div style="margin:0;padding:0;background:#0b0d14;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:#eef0f7">
  <div style="max-width:560px;margin:0 auto;padding:32px 24px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:26px">
      <span style="width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#7c6cff,#5b8cff);color:#fff;font-size:20px;line-height:36px;text-align:center">✦</span>
      <strong style="font-size:19px;letter-spacing:-.02em">Gem<span style="color:#9299ad">.AI</span></strong>
    </div>
    <div style="background:#141824;border:1px solid #262c3d;border-radius:16px;padding:26px">
      <h1 style="margin:0 0 12px;font-size:21px">Confirme o novo e-mail</h1>
      <p style="margin:0 0 16px;font-size:14px;line-height:1.65;color:#c4c9da">
        Você pediu para trocar o e-mail da sua conta de <b>{{ .OldEmail }}</b>
        para <b>{{ .NewEmail }}</b>. Confirme para concluir a alteração.
      </p>
      <p style="margin:0 0 24px;text-align:center">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 26px;border-radius:11px;background:linear-gradient(135deg,#7c6cff,#5b8cff);color:#fff;font-size:14px;font-weight:600;text-decoration:none">Confirmar novo e-mail</a>
      </p>
      <p style="margin:0;font-size:12px;line-height:1.6;color:#6e768d">
        <span style="color:#a78bfa;word-break:break-all">{{ .ConfirmationURL }}</span>
      </p>
    </div>
    <p style="margin:22px 0 0;font-size:11.5px;line-height:1.6;color:#6e768d">
      Se não foi você, ignore e troque sua senha imediatamente.
    </p>
  </div>
</div>
